name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The e2e tests need y-sweet; they run in the e2e job.
      - run: cargo test --workspace --exclude xtxp-fuzzer --exclude xtxp-muppet --exclude bench-browser
      - run: cargo test -p xtxp-muppet --lib --test cli_args
      # 500 fuzz seeds take about 3 minutes in debug.
      - run: cargo test --release -p xtxp-fuzzer

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # y-sweet v0.9.1, pinned by commit, built once and cached.
      - uses: actions/cache@v4
        with:
          path: .tools
          key: ysweet-4f1909b
      - run: |
          if [ ! -x .tools/bin/y-sweet ]; then
            cargo install --git https://github.com/jamsocket/y-sweet \
              --rev 4f1909b2c3390ced54d32b82a673f4f7ee8ac780 y-sweet --root .tools --locked
          fi
      - run: cargo test -p xtxp-muppet --test e2e --release

  browser:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # y-sweet and the Chromium 158 snapshot, built or fetched once and cached.
      - uses: actions/cache@v4
        with:
          path: .tools
          key: ysweet-4f1909b-chromium-1722227
      - run: |
          if [ ! -x .tools/bin/y-sweet ]; then
            cargo install --git https://github.com/jamsocket/y-sweet \
              --rev 4f1909b2c3390ced54d32b82a673f4f7ee8ac780 y-sweet --root .tools --locked
          fi
      - run: scripts/fetch-chromium.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p xtxp-muppet -p xtxp-serve
      # bench-browser's smoke run: every mode, 10 viewers, against a real y-sweet.
      - run: cargo test --release -p bench-browser
      - working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/xtxp-worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: crates/xtxp-worker
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
          cargo test
          npm ci
      - run: cargo build --release -p xtxp-muppet
      # wrangler builds the Worker with worker-build and runs it in workerd, locally.
      - working-directory: crates/xtxp-worker
        run: npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
      - run: node tests/worker/smoke.mjs
      - if: failure()
        run: cat crates/xtxp-worker/wrangler.log
