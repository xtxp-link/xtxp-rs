name = "xtxp"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "cargo install -q worker-build@^0.8 && worker-build --release"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed, which the Workers free plan requires.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
