[package]
name = "xtxp-worker"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A host and browser server for XTXP documents on a Cloudflare Worker: one Durable Object per document."
publish = false

# Its own workspace: it builds for wasm32-unknown-unknown with worker-build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
xmesh = { path = "../xmesh" }
xtxp-wire = { path = "../xtxp-wire" }
xtxp-serve = { path = "../xtxp-serve", default-features = false }
worker = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# xmesh and Yrs reach for randomness; in a Worker it comes from crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
