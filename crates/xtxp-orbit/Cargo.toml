[package]
name = "xtxp-orbit"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "xtxp-orbit"
path = "src/main.rs"

[dependencies]
xtxp-muppet = { path = "../xtxp-muppet", features = ["adapters"] }
xmesh = { path = "../xmesh" }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
