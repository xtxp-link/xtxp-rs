[package]
name = "xtxp-orbit"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "A muppet app: a three-body physics engine that owns the space and animates the XTXP logo."
publish = false

[[bin]]
name = "xtxp-orbit"
path = "src/main.rs"

[dependencies]
xmesh = { path = "../xmesh" }
xtxp-muppet = { path = "../xtxp-muppet", features = ["adapters"] }
tokio = { version = "1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
