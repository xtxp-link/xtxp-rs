[workspace]
resolver = "2"
members = ["crates/xmesh", "crates/xtxp-muppet", "crates/xtxp-serve", "crates/xtxp-tui", "crates/xtxp-orbit", "crates/xtxp-wire", "tools/chaos-proxy", "tools/fuzzer", "tools/yrs-compat", "tools/bench-browser"]
# Built for wasm32 with worker-build; its own workspace.
exclude = ["crates/xtxp-worker"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xtxp-link/xtxp-rs"

[workspace.dependencies]
yrs = "0.28.0"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
